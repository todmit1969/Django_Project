{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <h2 class="mb-4">Список продуктов</h2>

  <a href="{% url 'catalog:create_product' %}" class="btn btn-success mb-4">Добавить продукт</a>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    {% for product in object_list %}
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text">{{ product.description|truncatewords:20 }}</p>
            <p class="card-text"><strong>Цена:</strong> {{ product.price }} ₽</p>
          </div>
          <div class="card-footer d-flex flex-wrap gap-2">
            <a href="{% url 'catalog:single_product' product.pk %}" class="btn btn-primary btn-sm">Подробнее</a>

          </div>
        </div>
      </div>
    {% empty %}
      <div class="col">
        <div class="alert alert-warning">Нет доступных продуктов.</div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
