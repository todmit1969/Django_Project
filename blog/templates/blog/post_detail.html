<!DOCTYPE html>
{% extends 'blog/base.html' %}
{% block content %}

<h1>{{ object.title }}</h1>

<img src="{{ object.preview_image.url }}" alt="{{ object.title }}">
<p>{{ object.content }}</p>
<p>Просмотры: {{ object.views_counter }}</p>

<a href="{% url 'blog:post_update' object.pk %}">Редактировать</a>
<a href="{% url 'blog:post_delete' object.pk %}">Удалить</a>
<a href="{% url 'blog:post_list' %}">Назад к списку</a>
{% endblock %}
